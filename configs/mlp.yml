model: MLP

general:
  lr: 0.0001
  weight_decay: 0.0001
  first_layer_weight_decay: 0.0001
  batch_size: 256
  scheduler_type: cosine_warmup
  warmup_epochs: 0
  train_epochs: 101
  patience: 30
  label_column: age
  huber_delta: 0.36
  num_workers: 3

model_params:
  hidden_size: 32
  num_layers: 5
  input_dropout: 0.001
  dropout: 0.2

data:
  data_format: memmap
  metadata_path: /path/to/metadata.csv
  train_methylation_path: /path/to/training_data.memmap
  val_methylation_path: /path/to/validation_data.memmap
  imputation_path: /path/to/avg_beta_values.npy

output:
  save_dir: ./outputs/mlp
  checkpoint_name: mlp_checkpoint.pth