[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egbinn"
version = "0.1.0"
description = "EGBINN: Ensembled Gated Biological Interpretable Neural Network for DNA methylation-based age prediction"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["epigenetics", "aging-clock", "dna-methylation", "deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.0",
    "numpy",
    "pandas",
    "pyyaml",
    "scipy",
    "scikit-learn",
    "shap",
    "matplotlib",
    "seaborn",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "ty"]

[project.scripts]
egbinn-train = "egbinn.scripts.train:main"
egbinn-evaluate = "egbinn.scripts.evaluate:main"
egbinn-shap = "egbinn.scripts.shap_analysis:main"

[tool.hatch.build.targets.wheel]
packages = ["egbinn"]

[tool.ruff]
line-length = 120

[tool.ty.rules]
# torch's nn.Module declares `forward` in a way ty cannot reconcile with
# subclass overrides; every Module subclass trips this rule (see
# astral-sh/ty#1208). Known false positive for torch codebases.
invalid-mutable-override = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]